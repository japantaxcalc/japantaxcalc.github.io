kind = "web"
previewPath = "/"
title = "Japan Travel Tools"
version = "1.0.0"
id = "artifacts/japan-travel-tools"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24744

[services.development]
run = "pnpm --filter @workspace/japan-travel-tools run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/japan-travel-tools", "run", "build" ]
publicDir = "artifacts/japan-travel-tools/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24744"
BASE_PATH = "/"
