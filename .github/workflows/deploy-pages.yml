name: Deploy Japan Travel Tools to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        working-directory: artifacts/japan-travel-tools
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production
        run: pnpm run build

      - name: Add .nojekyll
        run: touch artifacts/japan-travel-tools/dist/public/.nojekyll

      - name: Create per-route index.html copies (SPA HTTP 200 fix)
        run: |
          DIST=artifacts/japan-travel-tools/dist/public
          for route in \
            yen-to-twd \
            japan-card-fee \
            shopping-trip-estimator \
            guide \
            japan-tax-2026 \
            japan-tax-8-vs-10 \
            japan-duty-free-guide \
            japan-airport-tax-refund \
            about \
            privacy \
            contact; do
            mkdir -p "$DIST/$route"
            cp "$DIST/index.html" "$DIST/$route/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/japan-travel-tools/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
